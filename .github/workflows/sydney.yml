name: Sydney Pools Bot

on:
  schedule:
    - cron: '50 6 * * *' # Jam 13.50 WIB
  workflow_dispatch:

jobs:
  run-sydney:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Sydney Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.CHAT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
        run: python sydney_pools.py

      - name: Commit and Push sydney_last_result.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f sydney_last_result.json ]; then
            git add sydney_last_result.json
            git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update sydney_last_result.json [skip ci]" && git push)
          fi
