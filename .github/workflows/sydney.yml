name: Sydney Pools Bot Test

on:
  workflow_dispatch:
  schedule:
    # Sydney result keluar sekitar jam 14:00 WIB (07:00 UTC)
    - cron: '*/5 7-8 * * *'

jobs:
  run-sydney:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Sydney Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python sydney_pools.py

      - name: Commit and Push sydney_last_result.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sydney_last_result.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update sydney_last_result.json [skip ci]" && git push)
