name: Cambodia Result Bot Auto-Schedule

on:
  workflow_dispatch: # Biar tetap bisa di-run manual kalau mau
  schedule:
    # Menggunakan waktu UTC. Cambodia jam 13:00 WIB (06:00 UTC)
    # Cron ini berjalan setiap 5 menit antara jam 06:00 UTC - 07:00 UTC (13:00 - 14:00 WIB)
    - cron: '*/5 6-7 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Diperlukan izin untuk commit back last_result.json

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bot Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py

      - name: Commit and Push last_result.json (Anti-Spam)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_result.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update last_result.json [skip ci]" && git push)
